# NX Downloader —— 在 GitHub 的服务器上编译，产出 nx-downloader.nro
#
# 为什么这么做：
#   devkitPro 的包服务器挂在 Cloudflare 后面，部分地区（含中国大陆很多宽带出口）
#   会被整站 403，本机装不上工具链。GitHub Actions 的 runner 在海外，通常不受限。
#
# 两条路（自动选择）：
#   A. native：用 devkitPro 官方的 Debian 安装脚本直接装（快）
#   B. docker：若 apt.devkitpro.org 不可达（Cloudflare 拦截 runner IP），
#      退回到官方镜像 devkitpro/devkita64 —— 镜像里已经装好了 devkitA64、libnx、
#      switch-dev 和 switch-portlibs（含 switch-curl），不需要再联网装包。
#
# 触发：push 代码，或在 Actions 页面手动点 "Run workflow"

name: build-nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 准备 devkitPro（优先官方脚本，不可达则用官方 Docker 镜像）
        id: dkp
        run: |
          set -x
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          code=$(curl -sSL -A "$UA" -o /tmp/idp -w '%{http_code}' \
                 https://apt.devkitpro.org/install-devkitpro-pacman || echo 000)
          echo "apt.devkitpro.org HTTP status = $code"
          if [ "$code" = "200" ] && grep -q pacman /tmp/idp; then
            chmod +x /tmp/idp
            sudo /tmp/idp
            sudo dkp-pacman -Syu --noconfirm
            echo "mode=native" >> "$GITHUB_OUTPUT"
          else
            echo "apt.devkitpro.org 不可达，改用官方 Docker 镜像 devkitpro/devkita64"
            docker pull devkitpro/devkita64:latest
            echo "mode=docker" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. 安装 Switch 工具链与 libcurl（仅 native 模式需要）
        if: steps.dkp.outputs.mode == 'native'
        run: |
          set -e
          sudo dkp-pacman -S --needed --noconfirm switch-dev
          sudo dkp-pacman -S --needed --noconfirm switch-curl

      - name: 4. 拉取 borealis（界面库，源码引入）
        run: |
          set -e
          # 注意：XITRIX/borealis 的默认分支是 moonlight_wiliwili（结构不同），
          # 必须显式指定 master 分支，否则找不到 library/borealis.mk
          git clone --depth=1 --recursive -b master \
            https://github.com/XITRIX/borealis.git borealis
          test -f borealis/library/borealis.mk || { echo "borealis.mk 缺失"; exit 1; }
          ls -l borealis/library/borealis.mk

      - name: 4b. 修补 borealis 与新版 libnx 的不兼容
        run: |
          set -e
          # 新版 libnx 移除了 swkbdConfigSetStringLenMaxExt。
          #
          # ⚠️ 直接把它替换成 swkbdConfigSetStringLenMax(&config, 32) 是**错的**：
          #    这一行紧跟在 swkbdConfigSetStringLenMax(&config, maxStringLength) 之后，
          #    会把调用方传进来的 maxStringLength（本程序要 100）覆盖成 32，
          #    结果界面上最多只能输入 32 个字符 —— 这正是 v2.0.0 里
          #    「输入框最长 100 字符」失效的原因。
          #
          # 正确做法：把这一行**整行删掉**，让上一行的 maxStringLength 生效。
          sed -i '/swkbdConfigSetStringLenMaxExt/d' borealis/library/lib/swkbd.cpp

          echo '--- 打完补丁后的相关代码 ---'
          grep -n -B1 -A1 "StringLenMax" borealis/library/lib/swkbd.cpp

          # 断言：Ext 那行确实没了，且 maxStringLength 那行还在
          ! grep -q "StringLenMaxExt" borealis/library/lib/swkbd.cpp
          grep -q "swkbdConfigSetStringLenMax(&config, maxStringLength);" borealis/library/lib/swkbd.cpp

      - name: 4c. 让左摇杆也能控制上下左右导航
        # borealis(master) 默认只把十字键映射成导航，左摇杆完全不处理
        # （源码里有一行 TODO: Translate axis events to dpad events here）。
        # 这里把左摇杆补成「带死区 + 长按重复」的导航输入。
        run: |
          set -e
          python3 - <<'PY'
          p = "borealis/library/lib/application.cpp"
          s = open(p).read()
          anchor = "    // TODO: Translate axis events to dpad events here\n"
          assert anchor in s, "anchor not found in " + p
          code = anchor + '''
              // --- nx-downloader: 左摇杆 -> 上下左右导航 ---
              {
                  static int stickDir = -1;
                  static retro_time_t stickLast = 0;
                  const float ax = Application::gamepad.axes[GLFW_GAMEPAD_AXIS_LEFT_X];
                  const float ay = Application::gamepad.axes[GLFW_GAMEPAD_AXIS_LEFT_Y];
                  const float dead = 0.5f;
                  int dir = -1;
                  if (ay < -dead)      dir = 0; // UP
                  else if (ay > dead)  dir = 1; // DOWN
                  else if (ax < -dead) dir = 2; // LEFT
                  else if (ax > dead)  dir = 3; // RIGHT
                  retro_time_t now = cpu_features_get_time_usec();
                  if (Application::blockInputsTokens == 0 && dir != -1)
                  {
                      if (dir != stickDir)
                      {
                          stickDir = dir;
                          stickLast = now;
                          Application::navigate((FocusDirection)dir);
                      }
                      else if (now - stickLast >= 180000)
                      {
                          stickLast = now;
                          Application::navigate((FocusDirection)dir);
                      }
                      else
                          stickLast = now;
                  }
                  else if (dir == -1)
                      stickDir = -1;
              }
          '''
          s = s.replace(anchor, code, 1)
          open(p, "w").write(s)
          print("patched application.cpp: 左摇杆导航已加入")
          PY
          grep -n "左摇杆 -> 上下左右导航" borealis/library/lib/application.cpp

      - name: 5. 同步 borealis 运行时资源
        run: |
          set -e
          if [ "${{ steps.dkp.outputs.mode }}" = "native" ]; then
            export DEVKITPRO=/opt/devkitpro
            export PATH="/opt/devkitpro/tools/bin:$PATH"
            make sync-resources
          else
            docker run --rm -v "$PWD":/src -w /src devkitpro/devkita64:latest \
              bash -lc 'make sync-resources'
          fi

      - name: 6. 编译
        # 用 make -k（keep going）：即使某个 .cpp 编译失败也继续编译其余文件，
        # 这样一次 CI 就能把所有编译错误都暴露出来，不用一个个来回试。
        # 完整日志写进 build.log，并在 Step Summary 里单独摘出所有 error: 行。
        run: |
          set -o pipefail
          if [ "${{ steps.dkp.outputs.mode }}" = "native" ]; then
            export DEVKITPRO=/opt/devkitpro
            export PATH="/opt/devkitpro/tools/bin:$PATH"
            make -k -j$(nproc) 2>&1 | tee build.log
          else
            docker run --rm -v "$PWD":/src -w /src devkitpro/devkita64:latest \
              bash -lc 'make -k -j$(nproc)' 2>&1 | tee build.log
            # 容器里是 root，产物属主改回 runner，否则上传 artifact 会无权读取
            sudo chown -R "$(id -u):$(id -g)" . || true
          fi
          {
            echo '### 编译错误汇总（error: ...）'
            echo '```'
            grep -n -B1 -A3 'error:' build.log | head -300 || echo '(没有 error: 行)'
            echo '```'
            echo '### make 输出（末尾 120 行）'
            echo '```'
            tail -120 build.log
            echo '```'
            echo '### 产物搜索'
            echo '```'
            find . -maxdepth 3 \( -name '*.nro' -o -name '*.elf' -o -name '*.nacp' \) | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 7. 产物信息
        run: |
          ls -lh *.nro *.elf *.nacp 2>/dev/null || true

      - name: 8. 上传 .nro
        uses: actions/upload-artifact@v4
        with:
          name: nx-downloader-nro
          path: |
            *.nro
            *.elf
          if-no-files-found: error
